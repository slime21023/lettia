name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.13"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Check formatting and lint
        run: |
          uv run ruff format --check src tests benchmarks examples
          uv run ruff check src tests benchmarks examples

      - name: Type check (pyrefly, primary)
        run: uv run pyrefly check

      - name: Type check (pyright)
        run: uv run pyright

      - name: Type check (mypy)
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: OpenAPI snapshot is up to date
        run: |
          uv run lettia openapi export examples.users_api:app --output examples/openapi.json
          git diff --exit-code examples/openapi.json

  package:
    name: Package validation
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.13"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uvx --from twine twine check dist/*
