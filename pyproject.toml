[project]
name = "lettia"
version = "0.1.0.dev0"
description = "Lettia — a contract-first ASGI framework"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "KevinChueh", email = "slime21023@gmail.com" }
]
keywords = ["asgi", "web", "web-framework", "asyncio", "openapi", "contract"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.22.0",
]

[project.scripts]
lettia = "lettia.cli:main"

[project.optional-dependencies]
test = [
    "httpx>=0.28.1",
]
yaml = [
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "openapi-spec-validator>=0.9.0",
    "pyrefly>=1.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6",
    "ruff>=0.17.1",
    "starlette>=1.8.0",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["spec", ".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ASYNC", "S"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pyrefly]
project-includes = ["src", "tests", "benchmarks", "examples"]
project-excludes = [".venv", "build", "dist", "tests/typing/negative"]
python-version = "3.12"
search-path = ["."]
preset = "strict"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"tests/typing/negative/*.py" = ["F401", "I001", "E501"]
