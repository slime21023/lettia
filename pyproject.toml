[project]
name = "lettia"
version = "1.0.1rc2"
description = "Lettia — Lightweight High-Performance Python ASGI Core Library"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "KevinChueh", email = "slime21023@gmail.com" }
]
keywords = ["asgi", "web", "web-framework", "asyncio", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"benchmarks/**/*.py" = ["S105"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pyrefly]
project-includes = ["src", "tests", "examples"]
project-excludes = [".venv", "build", "dist"]
search-path = ["src", "."]
python-version = "3.12"
preset = "strict"

[tool.pyrefly.coverage]
includes = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=lettia",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
